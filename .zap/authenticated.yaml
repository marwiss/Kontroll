# The nightly job's scan as someone signed in: the API from its document with bearer tokens, and
# the administration through its pages with a session cookie. The baseline scan looks at what
# anyone can reach; this one attacks what takes a sign-in. See docs/security/pentest-howto.md.
#
# The API goes first, since the scan sends the pages' forms again with their valid tokens, and
# they can disable the user who holds the API's token. What ends the scan's own sign-in is left
# out, or everything after it would be answered 401 and prove nothing (.zap/reached.py checks).
#
# TARGET comes from the environment. SESSION, TOKEN, ADMIN_TOKEN and ADMIN_ID are filled in by .zap/credentials.py,
# which writes the copy of this plan that runs, since ZAP leaves variables in a replacer rule as they stand.
env:
  contexts:
    - name: api
      urls:
        - ${TARGET}/foundation/versions
        - ${TARGET}/bcf/3.0/projects
        - ${TARGET}/bcf/2.1/projects
        - ${TARGET}/documents/1.0/
        - ${TARGET}/admin/api/users
      includePaths:
        - ${TARGET}/(foundation|bcf|documents/1\.0|admin/api)/.*
      excludePaths:
        - ${TARGET}/admin/api/sessions.*
        - ${TARGET}/foundation/oauth2/revoke.*
    - name: pages
      urls:
        - ${TARGET}/admin
      includePaths:
        - ${TARGET}/admin.*
      excludePaths:
        - ${TARGET}/admin/api.*
        - ${TARGET}/admin/sessions.*
        - ${TARGET}/admin/users/${ADMIN_ID}.*
        - ${TARGET}/signout.*
        - ${TARGET}/account.*
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      # The url of a rule is a regular expression, so ${TARGET} cannot stand in it.
      - description: The administrator's session on the pages
        url: ^https?://[^/]+/(admin|documents/1\.0/(upload|select)-ui).*
        matchType: req_header
        matchString: Cookie
        matchRegex: false
        replacementString: opencde_session=${SESSION}
      - description: A manager's token on the APIs
        url: ^https?://[^/]+/(foundation|bcf|documents/1\.0).*
        matchType: req_header
        matchString: Authorization
        matchRegex: false
        replacementString: Bearer ${TOKEN}
      - description: An administrator's token on the administration API
        url: ^https?://[^/]+/admin/api.*
        matchType: req_header
        matchString: Authorization
        matchRegex: false
        replacementString: Bearer ${ADMIN_TOKEN}
  - type: openapi
    parameters:
      apiUrl: ${TARGET}/openapi.json
      context: api
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: activeScan
    parameters:
      context: api
      maxScanDurationInMins: 15
  - type: spider
    parameters:
      context: pages
      url: ${TARGET}/admin
      maxDuration: 3
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: activeScan
    parameters:
      context: pages
      maxScanDurationInMins: 10
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/
      reportFile: zap-authenticated
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/
      reportFile: zap-authenticated
