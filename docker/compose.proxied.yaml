# This file was generated with the assistance of an AI coding tool.
#
# Beside what already runs on a server: behind a reverse proxy that is there already (nginx, Apache, Traefik), which
# keeps its ports 80 and 443, its certificates and its other sites. The production overlay without its Caddy: the API
# is published on one address and port for that proxy only, 127.0.0.1:8010 unless OPENCDE_PROXIED_ADDRESS and
# OPENCDE_PROXIED_PORT say otherwise; the database is never published; the nightly backup runs as before. Combine,
# with a project name of its own so that the stack shares no container, network or volume with anything there:
#   COMPOSE_PROJECT_NAME=dataregium
#   COMPOSE_FILE=docker/compose.yaml:docker/compose.prod.yaml:docker/compose.proxied.yaml
# See docs/en/deploy/proxied.md.

services:
  proxy:
    profiles: ["caddy"]  # left out: the proxy on the host terminates TLS

  api:
    ports:
      - "${OPENCDE_PROXIED_ADDRESS:-127.0.0.1}:${OPENCDE_PROXIED_PORT:-8010}:8000"
