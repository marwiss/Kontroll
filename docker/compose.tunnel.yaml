# Tunnel overlay: a public https URL for client tests without opening ports.
# Cloudflare Tunnel (free) gives a stable hostname on your own domain; the
# tunnel's edge terminates TLS and forwards to the API on the compose network.
#
#   1. Create a tunnel in Cloudflare Zero Trust, route your hostname to http://api:8000,
#      and copy the token into .env as TUNNEL_TOKEN. Set OPENCDE_PUBLIC_URL=https://<hostname>.
#   2. docker compose -f compose.yaml -f compose.tunnel.yaml up -d
#
# See docs/en/deploy/tunnel.md (also for Tailscale Funnel and ngrok).

services:
  api:
    environment:
      OPENCDE_ENVIRONMENT: production
      OPENCDE_TRUSTED_PROXIES: '["172.16.0.0/12", "10.0.0.0/8", "192.168.0.0/16"]'

  tunnel:
    image: docker.io/cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env (from Cloudflare Zero Trust)}"
    depends_on:
      - api
    networks:
      - internal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
