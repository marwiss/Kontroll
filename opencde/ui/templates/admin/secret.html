{% extends "admin/_page.html" %}
{% block title %}{{ title }} · {{ product }}{% endblock %}
{% block admin %}
<h1>{{ title }}</h1>
<section class="card">
  {{ alert("warning", lead, title="Shown once.") }}
  {% if extra_label %}
  <dl class="facts"><dt>{{ extra_label }}</dt><dd><code id="extra-value">{{ extra_value }}</code></dd></dl>
  {% endif %}
  <p class="secret" id="secret-value">{{ secret }}</p>
  <div class="cluster">
    <button class="btn btn--secondary" type="button" data-copy-target="secret-value">Copy</button>
    <a class="btn btn--primary" href="{{ back_url }}">{{ back_text }}</a>
  </div>
</section>
{% endblock %}
