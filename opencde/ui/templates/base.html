<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}{{ product }}{% endblock %}</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/">
        <img class="brand__mark" src="/static/icon.svg" alt="" width="28" height="28">
        <span class="brand__name">{{ product }}</span>
        <span class="brand__host">{{ server_host }}</span>
      </a>
      {% block nav %}{% endblock %}
    </div>
  </header>
  <main id="main" class="site-main {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>{{ product }}</span>
    <a href="/docs">API documentation</a>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
