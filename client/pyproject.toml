[project]
name = "opencde-client"
version = "0.1.0.dev0"
description = "Python client for buildingSMART OpenCDE servers: Foundation API 1.0, BCF API 3.0 and Documents API 1.0, with OAuth2 authorization code + PKCE."
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.11"
keywords = ["BCF", "OpenCDE", "IFC", "BIM", "buildingSMART"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx>=0.28",
]

[project.urls]
Source = "https://github.com/marwiss/Kontroll"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencde_client"]
