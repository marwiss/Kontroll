name: Release

# A tag v* builds the multi-arch image, scans it, publishes it to GHCR with an
# SBOM, and creates a GitHub release carrying the SBOM and the scan report.
# The image with buildingSMART's rules, tagged -gherkin, is built, scanned and
# published the same way; both are scanned before either is published.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/marwiss/opencdeserver

jobs:
  image:
    name: Build, scan and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # The same image with buildingSMART's ifc-gherkin-rules (ADR 0012), for those who choose them: 3.0.0-gherkin.
      - id: meta-gherkin
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            suffix=-gherkin,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Build for the host platform first so the image can be scanned before anything is published.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (fail on fixable HIGH and CRITICAL vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Trivy report (SARIF, attached to the release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: sarif
          output: trivy.sarif
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:scan
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Build with buildingSMART's rules for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          build-args: OPENCDE_GHERKIN=1
          tags: ${{ env.IMAGE }}:scan-gherkin
          cache-from: |
            type=gha
            type=gha,scope=gherkin
          cache-to: type=gha,mode=max,scope=gherkin
      - name: Trivy on the image with the rules (fail on fixable HIGH and CRITICAL vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan-gherkin
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Publish multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish multi-arch image with buildingSMART's rules
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: OPENCDE_GHERKIN=1
          tags: ${{ steps.meta-gherkin.outputs.tags }}
          labels: ${{ steps.meta-gherkin.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha
            type=gha,scope=gherkin
          cache-to: type=gha,mode=max,scope=gherkin

      # The runner's own gh CLI creates the release (zizmor: no third-party action needed for this).
      - name: GitHub release with SBOM and scan report
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes sbom.spdx.json trivy.sarif
