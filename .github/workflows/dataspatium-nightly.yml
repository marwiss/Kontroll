name: Nightly pair test with Dataspatium

# Dataspatium's automated live suite (checklist C of docs/acceptance.md and
# more: discovery, PKCE sign-in, the BCF tables, both Documents API flows, the
# IFC graph over Bolt, the request log through the administration API) against
# this server's development stack, with the Dataspatium release that pairs with
# this Dataregium. "Tests across the repositories" in
# docs/dataspatium-coordination.md describes it. The
# helpers in Dataspatium's tools/ play the user at the server's own pages.

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  # The Dataspatium release that pairs with this Dataregium: the same number (README, "Dataregium and Dataspatium").
  # By commit, because a release's tag goes away when the next release of its major number is out.
  DATASPATIUM_REF: 205e5c92c9e305d98c9da62ddfdf5caf8ec9fa18 # v2.0.0
  # Demo data only; the database lives for this job.
  SEED_PASSWORD: demo-password-for-ci-only

jobs:
  live:
    name: Dataspatium live suite against the development stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: marwiss/Dataspatium
          ref: ${{ env.DATASPATIUM_REF }}
          path: dataspatium
          persist-credentials: false
      - name: Let the browser use its sandbox
        # Ubuntu restricts the unprivileged user namespaces that Chromium's sandbox needs, and it aborts without them.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check that the browser starts
        # Fails at once and shows why, instead of the suite waiting for a summary from a browser that has died.
        run: chromium --headless=new --disable-gpu --no-first-run --dump-dom about:blank | grep -q '<html'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - name: Start the server with demo data and a client for the app
        run: |
          uv run opencde init --dev
          printf 'OPENCDE_IFC_LPG_ENABLED=true\nOPENCDE_DYNAMIC_CLIENT_REGISTRATION=true\nOPENCDE_REQUEST_LOG_ENABLED=true\nOPENCDE_GRAPH_QUERY_ENABLED=true\n' >> .env
          # One run of the suite uses nearly all of the limit on signing in, and there are two.
          echo 'OPENCDE_RATE_LIMIT_SIGN_IN=60/minute' >> .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/readyz && break  # no output: add-mask must start a line
            sleep 2
          done
          server="docker compose exec -T api opencde"
          $server seed --password "$SEED_PASSWORD" > /dev/null
          client_id=$($server client create "Dataspatium (nightly)" --public \
            --redirect-uri http://127.0.0.1:8080/oauth-callback.html \
            | sed -n 's/.*client_id \([^ ]*\).*/\1/p')
          test -n "$client_id"
          echo "CLIENT_ID=$client_id" >> "$GITHUB_ENV"
          graph_password=$(sed -n 's/^OPENCDE_GRAPH_PASSWORD=//p' .env)
          echo "::add-mask::$graph_password"
          echo "GRAPH_PASSWORD=$graph_password" >> "$GITHUB_ENV"
      - name: Serve the app and start the helpers that play the user and the administrator
        run: |
          (cd dataspatium && nohup python3 -m http.server 8080 --bind 127.0.0.1 > ../http-server.log 2>&1 &)
          CDE_USER=officer CDE_HELPER_PORT=8094 nohup uv run --with httpx python dataspatium/tools/cde-helper.py > helper-user.log 2>&1 &
          CDE_USER=admin CDE_HELPER_PORT=8095 nohup uv run --with httpx python dataspatium/tools/cde-helper.py > helper-admin.log 2>&1 &
          wait_for() {
            for i in $(seq 1 60); do
              curl -fsS -o /dev/null "$1" && return 0
              sleep 1
            done
            echo "not reachable: $1" >&2
            return 1
          }
          wait_for http://127.0.0.1:8080/tests/index.html
          wait_for http://127.0.0.1:8094/health
          wait_for http://127.0.0.1:8095/health
        env:
          CDE_BASE: http://127.0.0.1:8000
          CDE_PASSWORD: ${{ env.SEED_PASSWORD }}
      - name: Run the live suite in Chromium
        run: |
          bash dataspatium/tools/run-tests.sh \
            --url "http://127.0.0.1:8080/tests/index.html?only=opencde%20live" --browsers chromium --timeout 1200 \
            | tee suite.log
          # Only the summary counts: a suite that never ran, or ran nothing, must not pass as green.
          grep -E 'DATASPATIUM-TESTS: pass=[1-9][0-9]* fail=0$' suite.log
        env:
          DATASPATIUM_CDE_URL: http://127.0.0.1:8000
          DATASPATIUM_CDE_HELPER: http://127.0.0.1:8094
          DATASPATIUM_CDE_CLIENT: ${{ env.CLIENT_ID }}
          DATASPATIUM_CDE_USER: officer
          DATASPATIUM_CDE_PROJECT: Building permit
          DATASPATIUM_CDE_GRAPH: bolt://127.0.0.1:7697
          DATASPATIUM_CDE_GRAPH_DB: neo4j
          DATASPATIUM_CDE_GRAPH_USER: neo4j
          DATASPATIUM_CDE_GRAPH_PASS: ${{ env.GRAPH_PASSWORD }}
          DATASPATIUM_CDE_ADMIN_HELPER: http://127.0.0.1:8095
      - name: Run the live suite through BCF API 2.1
        # The same project, sign-in and checks, with the app speaking the older version of the API.
        run: |
          bash dataspatium/tools/run-tests.sh \
            --url "http://127.0.0.1:8080/tests/index.html?only=opencde%20live" --browsers chromium --timeout 1200 \
            | tee suite-bcf21.log
          grep -E 'DATASPATIUM-TESTS: pass=[1-9][0-9]* fail=0$' suite-bcf21.log
        env:
          DATASPATIUM_CDE_BCF: "2.1"
          DATASPATIUM_CDE_URL: http://127.0.0.1:8000
          DATASPATIUM_CDE_HELPER: http://127.0.0.1:8094
          DATASPATIUM_CDE_CLIENT: ${{ env.CLIENT_ID }}
          DATASPATIUM_CDE_USER: officer
          DATASPATIUM_CDE_PROJECT: Building permit
          DATASPATIUM_CDE_GRAPH: bolt://127.0.0.1:7697
          DATASPATIUM_CDE_GRAPH_DB: neo4j
          DATASPATIUM_CDE_GRAPH_USER: neo4j
          DATASPATIUM_CDE_GRAPH_PASS: ${{ env.GRAPH_PASSWORD }}
          DATASPATIUM_CDE_ADMIN_HELPER: http://127.0.0.1:8095
      - name: Logs
        if: always()
        run: |
          echo "== browser"; tail -n 60 "${TMPDIR:-/tmp}"/dm-tests-*/chromium.log || true
          echo "== helper (user)"; tail -n 50 helper-user.log || true
          echo "== helper (administrator)"; tail -n 50 helper-admin.log || true
          echo "== server"; docker compose logs api | tail -n 200
