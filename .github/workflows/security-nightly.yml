name: Nightly security

# Slow or noisy checks that do not belong in every push: the Memgraph contract
# run, an image vulnerability scan, an OWASP ZAP baseline scan of the running
# server's pages and API, the same scanner signed in, a restart of the stack,
# and MCP's conformance suite against the MCP endpoint.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  memgraph:
    name: Integration and e2e on Memgraph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # The IFC-DB module and buildingSMART's rules too, as the integration job runs them on Neo4j.
      - run: uv sync --extra ifc-db
      - run: uv run python -m ifc_db.gherkin_install "$RUNNER_TEMP/gherkin"
      - run: uv run pytest -q -m "integration or e2e"
        env:
          OPENCDE_TEST_MEMGRAPH: "1"
          OPENCDE_SCHEMATHESIS_EXAMPLES: "50"
          OPENCDE_TEST_GHERKIN_ENV: ${{ runner.temp }}/gherkin

  zap-signed-in:
    name: OWASP ZAP signed in (API and administration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - name: Start the server with demo data
        run: |
          uv run opencde init --dev
          # The scan is to see every page it asks for, and the same answer to the same question.
          echo "OPENCDE_RATE_LIMITS_ENABLED=false" >> .env
          echo "OPENCDE_SIGN_IN_THROTTLE_ENABLED=false" >> .env
          docker compose up -d --build --wait
          docker compose exec -T api opencde seed --password demo-password-for-zap-only > seed.txt
          echo "CLIENT_ID=$(awk '/client +public/ {print $3}' seed.txt)" >> "$GITHUB_ENV"
      - name: Sign in
        run: uv run python tests/security/zap/credentials.py http://127.0.0.1:8000 "$CLIENT_ID" demo-password-for-zap-only
      - name: The scan
        run: |
          chmod a+w tests/security/zap
          docker run --rm --network host -v "$PWD/tests/security/zap:/zap/wrk:rw" \
            -e TARGET=http://127.0.0.1:8000 \
            ghcr.io/zaproxy/zaproxy:2.17.0 zap.sh -cmd -autorun /zap/wrk/authenticated-filled.yaml
      - name: What it reached
        run: docker compose logs api | uv run python tests/security/zap/reached.py
      - name: What it found
        run: uv run python tests/security/zap/findings.py tests/security/zap/zap-authenticated.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-signed-in
          path: tests/security/zap/zap-authenticated.*
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Server log
        if: always()
        run: docker compose logs api | tail -200

  mcp-conformance:
    name: MCP conformance suite against the MCP endpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - name: Start the server with demo data and the MCP endpoint on
        run: |
          uv run opencde init --dev
          # The suite comes through the proxy below, on its port; the endpoint takes a browser origin it names.
          sed -i 's|^OPENCDE_CORS_ORIGINS=.*|OPENCDE_CORS_ORIGINS=["http://127.0.0.1:8001", "http://localhost:8001"]|' .env
          echo "OPENCDE_MCP_ENABLED=true" >> .env
          echo "OPENCDE_RATE_LIMITS_ENABLED=false" >> .env
          docker compose up -d --build --wait
          docker compose exec -T api opencde seed --password demo-password-for-mcp-only > seed.txt
          echo "CLIENT_ID=$(awk '/client +public/ {print $3}' seed.txt)" >> "$GITHUB_ENV"
      - name: A token bound to the endpoint, and a proxy that adds it to the suite's requests
        run: |
          uv run python -m tests.conformance.mcp_proxy http://127.0.0.1:8000 "$CLIENT_ID" demo-password-for-mcp-only 8001 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8001/healthz && break
            sleep 1
          done
      # The scenarios that concern what the endpoint offers, at both eras it answers; the suite's Node comes with
      # the runner. tests/conformance/mcp-baseline.yml names what the endpoint is known not to have.
      - name: The conformance suite
        run: |
          suite="npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.12 server --url http://127.0.0.1:8001/mcp"
          baseline="--expected-failures tests/conformance/mcp-baseline.yml -o results"
          failed=0
          for scenario in server-stateless tools-list caching dns-rebinding-protection server-sse-multiple-streams; do
            $suite --scenario "$scenario" --spec-version 2026-07-28 $baseline || failed=1
          done
          for scenario in server-initialize ping tools-list dns-rebinding-protection; do
            $suite --scenario "$scenario" --spec-version 2025-11-25 $baseline || failed=1
          done
          exit "$failed"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-conformance
          path: results/
          if-no-files-found: ignore
      - name: Server log
        if: always()
        run: docker compose logs api | tail -200

  restart:
    name: The stack in Docker outlives a restart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q -m e2e tests/e2e/test_restart.py
        env:
          OPENCDE_TEST_COMPOSE: "1"

  image:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: opencdeserver:nightly
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opencdeserver:nightly
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  zap:
    name: OWASP ZAP baseline against the running server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync
      - name: Start the server with demo data
        run: |
          uv run opencde init --dev
          echo "OPENCDE_RATE_LIMITS_ENABLED=false" >> .env  # the scan is to see every page it asks for
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/readyz && break
            sleep 2
          done
          docker compose exec -T api opencde seed --password demo-password-for-zap-only
      - name: ZAP baseline (pages and public API surface)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:8000
          rules_file_name: tests/security/zap/rules.tsv
          cmd_options: "-a -j"
          fail_action: true
          allow_issue_writing: false
      - name: Server log
        if: always()
        run: docker compose logs api | tail -200
