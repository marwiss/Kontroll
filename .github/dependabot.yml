version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait before adopting a new release: freshly published versions are where
    # compromised packages show up first (supply-chain hygiene, zizmor audit).
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # openapi-core 0.23 holds it below 0.9, so a bump of its own cannot be resolved and failed the job;
      # it moves with openapi-core instead.
      - dependency-name: "openapi-spec-validator"
        versions: [">=0.9"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
